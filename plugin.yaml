name: nanlmind-hermes
version: 1.3.0
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"
description: Local NaNLMind conversational learning, explicit staged training, reproducible evaluation and NANNET-connected universe operations through Hermes.
license: Apache-2.0
homepage: https://github.com/shemshallah/NaNLMind_HERMES
tags: [nanlmind, training, corpus, local-runner, nannet]
provides_tools:
  - nanlm_status
  - nanlm_chat
  - nanlm_chat_history
  - nanlm_phone_call
  - nanlm_auth_init
  - nanlm_auth_status
  - nanlm_auth_pair
  - nanlm_auth_revoke
  - nanlm_generate_curriculum
  - nanlm_curriculum_experiment
  - nanlm_logic_session
  - nanlm_word_session
  - nanlm_sentence_session
  - nanlm_training_pipeline
  - nanlm_nan16de_route
  - nanlm_generate_corpus
  - nanlm_train
  - nanlm_math_train
  - nanlm_structured_relation_train
  - nanlm_evaluate
  - nanlm_memory_ingest
  - nanlm_memory_reorganize
  - nanlm_memory_cross_resolution
  - nanlm_memory_merge
  - nanlm_memory_query
  - nanlm_memory_assessments
  - nanlm_clocked_plan
  - nanlm_clocked_execute
  - nanlm_clocked_scratch
  - nanlm_head_process
  - nanlm_clocked_synthesize
  - nanlm_head_candidate
  - nanlm_head_candidate_evaluate
  - nanlm_head_learn_candidate
config_schema:
  duration_minutes:
    type: int
    default: 30
    description: Wall-clock budget in minutes for the local native bootstrap run (1–360).
  checkpoint_interval_seconds:
    type: int
    default: 60
    description: Reserved for native checkpoint support; current bootstrap artifacts are reproducibility manifests, not resumable model weights.
  chat_learning:
    type: bool
    default: true
    description: Enable free-form chat parsing to update native heads, mirror pairs and hyperedges when explicit supervised relations are extracted.
  chat_mode:
    type: str
    default: native
    description: "native: NaNLMind parses, learns and synthesizes through the shared scratch window. auto: use the Hermes model when available and fall back to native. provider: legacy LLM-authored chat reply."
  runner_command:
    type: list
    default: []
    description: Local native executable argv, e.g. ["/path/to/NaNLMind/build/nanlm-universal"].
  state_dir:
    type: str
    default: ~/.local/share/nanlmind-hermes
    description: Local working directory and native checkpoint path for the one HW0::BS0 state. All BS0 workers and attached clients must share this canonical state path; do not create per-runner or per-endpoint universes.
  clocked_gateway_url:
    type: str
    default: ""
    description: NaNLMind_CLOCKED participant gateway URL; use HTTPS except localhost. The participant token is supplied separately as CLOCKED_GATEWAY_TOKEN.
  clocked_gateway_token:
    type: secret
    env: CLOCKED_GATEWAY_TOKEN
    description: Scoped CLOCKED participant credential, retrieved only through Hermes secret scope.
  nanlm_head_cortex_url:
    type: str
    default: ""
    description: NaNLMind head-cortex receiving endpoint; use HTTPS except localhost.
  nanlm_device_token:
    type: secret
    env: NANLM_DEVICE_TOKEN
    description: Scoped NaNLMind participant credential for head-cortex operations.
  nannet_auth_url:
    type: str
    default: ""
    description: NANNET pairing and scope-verification authority URL; use HTTPS except localhost.
  nannet_issuer_public_key:
    type: str
    default: ""
    description: Pinned base64url Ed25519 issuer public key used to validate paired NANNET tokens.
  nannet_master_key:
    type: secret
    env: NANNET_MASTER_KEY
    description: Independent random 256-bit key used to encrypt this installation's private identity and paired token at rest.
