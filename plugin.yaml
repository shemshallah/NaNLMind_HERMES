name: nanlmind-hermes
version: 0.1.0
manifest_version: 2
api_version: 1
description: Train and inspect one local NaNLMind 256-head universe through Hermes.
license: MIT
homepage: https://github.com/shemshallah/NaNLMind_HERMES
tags: [nanlmind, training, corpus, local-runner]
config_schema:
  duration_minutes:
    type: int
    default: 30
    description: Default training wall-clock budget in minutes (1–360).
  checkpoint_interval_seconds:
    type: int
    default: 60
    description: Requested checkpoint cadence for the native runner.
  runner_command:
    type: list
    default: []
    description: Local native runner argv; empty disables training until configured.
  state_dir:
    type: str
    default: ~/.local/share/nanlmind-hermes
    description: Per-installation local universe and corpus state directory.
