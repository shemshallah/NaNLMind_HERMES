config_schema:
  duration_minutes:
    type: int
    default: 30
    description: Wall-clock budget in minutes for the local native bootstrap run (1–360).
  checkpoint_interval_seconds:
    type: int
    default: 60
    description: Reserved for native checkpoint support; current bootstrap artifacts are reproducibility manifests, not resumable model weights.
  chat_learning:
    type: bool
    default: true
    description: Enable free-form chat parsing to update native heads, mirror pairs and hyperedges when explicit supervised relations are extracted.
  learning_min_support:
    type: int
    default: 3
    description: Minimum repeated relation support before a scratch candidate may be promoted.
  learning_min_confidence:
    type: float
    default: 0.6
    description: Minimum conservative confidence for a relation promotion candidate.
  learning_max_candidates:
    type: int
    default: 64
    description: Maximum relation candidates considered in one synchronization pass.
  learning_max_promoted_leaves:
    type: int
    default: 100
    description: Maximum leaves retained in the local 8 MiB head register.
  learning_require_approval:
    type: bool
    default: true
    description: Require explicit approved=true before scratch leaves enter the local head register.
  learning_auto_sync:
    type: bool
    default: false
    description: Automatically attempt conservative synchronization after each observation. Keep false until the promotion rules are accepted.
  merge_enabled:
    type: bool
    default: false
    description: Explicit operator option for local promotion/merge paths. Keep false until a generation-checked canonical merge gate exists; false returns merge_disabled and never promotes or merges.
  resident_size_bytes:
    type: int
    default: 268435456
    description: Sparse file budget for the one-file resident universe. Default 256 MiB; hard ceiling 1 GiB; never a 2 GiB overbootstrap copy.
  resident_learning_enabled:
    type: bool
    default: true
    description: Feed accepted free-chat exposure into the resident mirror-pair/leaf store. Probe reads never mutate it.
  wordnet_archive:
    type: str
    default: ""
    description: Optional path to the WordNet 3.1 zip archive for the sparse HW4 dictionary universe.
  self_mod_min_boolean:
    type: float
    default: 0.5
    description: Minimum Boolean gate confidence for an allowed self-modification relation.
  self_mod_require_evidence:
    type: bool
    default: true
    description: Require a SHA-256 evidence digest on every self-modification.
  self_mod_allow_negative:
    type: bool
    default: true
    description: Record Boolean-rejected relations as negative memory instead of discarding them.
  self_mod_require_approval:
    type: bool
    default: true
    description: Require explicit approval before self-modified leaves enter the local head register.
  teacher_provider:
    type: str
    default: "hermes"
    description: "Teacher provider: hermes (configured Hermes LLM), ollama (local Gemma/Ollama), or openai (any OpenAI-compatible endpoint)."
  teacher_endpoint:
    type: str
    default: ""
    description: Optional provider endpoint; defaults to the Hermes LLM or the local Ollama generate URL.
  teacher_model:
    type: str
    default: ""
    description: Optional provider model; defaults to the Hermes LLM or gemma4:31b-cloud.
  chat_mode:
    type: str
    default: native
    description: "native: NaNLMind parses, learns and synthesizes through the shared scratch window. auto: use the Hermes model when available and fall back to native. provider: legacy LLM-authored chat reply."
  runner_command:
    type: list
    default: []
    description: Local native executable argv, e.g. ["/path/to/NaNLMind/build/nanlm-universal"].
  nan0s_root:
    type: str
    default: ""
    description: Optional path to a NaN0S checkout. If empty, the plugin auto-detects a sibling/configured checkout or compiles its bundled portable C core.
  nan0s_cc:
    type: str
    default: ""
    description: Optional C compiler for the portable NaN0S core (default cc/gcc/clang autodetect).
  nan0s_prefer_bundled:
    type: bool
    default: false
    description: Prefer the plugin's bundled portable NaN0S source snapshot over an external checkout or prebuilt nan_cli.
  state_dir:
    type: str
    default: ~/.local/share/nanlmind-hermes
    description: Local working directory for HERMES state. BS0:0 is the shared runner-ring NANNET port; HW0:0 is a distinct hardware node. HERMES guest universes require independent authorized leases and must never alias canonical BS0 training state.
  clocked_gateway_url:
    type: str
    default: ""
    description: NaNLMind_CLOCKED participant gateway URL; use HTTPS except localhost. The participant token is supplied separately as CLOCKED_GATEWAY_TOKEN.
  clocked_gateway_token:
    type: secret
    env: CLOCKED_GATEWAY_TOKEN
    description: Scoped CLOCKED participant credential, retrieved only through Hermes secret scope.
  nanlm_head_cortex_url:
    type: str
    default: ""
    description: NaNLMind head-cortex receiving endpoint; use HTTPS except localhost.
  nanlm_device_token:
    type: secret
    env: NANLM_DEVICE_TOKEN
    description: Scoped NaNLMind participant credential for head-cortex operations.
  nannet_auth_url:
    type: str
    default: ""
    description: NANNET pairing and scope-verification authority URL; use HTTPS except localhost.
  nannet_issuer_public_key:
    type: str
    default: ""
    description: Pinned base64url Ed25519 issuer public key used to validate paired NANNET tokens.
  nannet_master_key:
    type: secret
    env: NANNET_MASTER_KEY
    description: Independent random 256-bit key used to encrypt this installation's private identity and paired token at rest.
