name: nanlmind-hermes
version: 1.0.1
manifest_version: 2
api_version: 1
description: Local NaNLMind conversational learning, explicit staged training, reproducible evaluation and NANNET-connected universe operations through Hermes.
license: MIT
homepage: https://github.com/shemshallah/NaNLMind_HERMES
tags: [nanlmind, training, corpus, local-runner, nannet]
provides_tools:
  - nanlm_status
  - nanlm_chat
  - nanlm_chat_history
  - nanlm_auth_init
  - nanlm_auth_status
  - nanlm_auth_pair
  - nanlm_auth_revoke
  - nanlm_generate_curriculum
  - nanlm_curriculum_experiment
  - nanlm_logic_session
  - nanlm_word_session
  - nanlm_sentence_session
  - nanlm_training_pipeline
  - nanlm_nan16de_route
  - nanlm_generate_corpus
  - nanlm_train
  - nanlm_math_train
  - nanlm_structured_relation_train
  - nanlm_evaluate
  - nanlm_memory_ingest
  - nanlm_memory_reorganize
  - nanlm_memory_cross_resolution
  - nanlm_memory_merge
  - nanlm_memory_query
  - nanlm_memory_assessments
  - nanlm_clocked_plan
  - nanlm_clocked_execute
  - nanlm_clocked_scratch
  - nanlm_head_process
  - nanlm_clocked_synthesize
  - nanlm_head_candidate
  - nanlm_head_candidate_evaluate
config_schema:
  duration_minutes:
    type: int
    default: 30
    description: Wall-clock budget in minutes for the local native bootstrap run (1–360).
  checkpoint_interval_seconds:
    type: int
    default: 60
    description: Reserved for native checkpoint support; current bootstrap artifacts are reproducibility manifests, not resumable model weights.
  chat_learning:
    type: bool
    default: true
    description: Enable free-form chat reflection to update native heads, mirror pairs and hyperedges when explicit supervised relations are extracted.
  runner_command:
    type: list
    default: []
    description: Local native executable argv, e.g. ["/path/to/NaNLMind/build/nanlm-universal"].
  state_dir:
    type: str
    default: ~/.local/share/nanlmind-hermes
    description: Per-installation local universe, corpus, run logs and manifests.

  universe_layers:
    type: int
    default: 7
    description: Number of logical memory projection layers (L0-L6).

  clocked_gateway_url:
    type: str
    default: ""
    description: NaNLMind_CLOCKED participant gateway URL; use HTTPS except localhost. The participant token is supplied separately as CLOCKED_GATEWAY_TOKEN.
