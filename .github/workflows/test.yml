name: plugin-tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package dependencies
        run: python -m pip install -e ".[auth]"
      - name: Run policy, runner, and auth tests
        run: python -m unittest discover -s tests -v

  hermes-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hermes Agent v0.23.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/v0.23.0/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate catalog admission contract
        run: hermes plugins validate . --install-deps
      - name: Validate plugin registration in isolation
        run: hermes plugins doctor . --ci
