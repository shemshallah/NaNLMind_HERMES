name: plugin-tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package dependencies
        run: python -m pip install -e ".[auth]"
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

  hermes-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Hermes Agent v0.23.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/v0.23.0/scripts/install.sh | bash -s -- --commit 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19 --channel main --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate catalog admission contract
        run: hermes plugins validate . --install-deps
      - name: Validate plugin registration in isolation
        run: hermes plugins doctor . --ci

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify source distribution contains plugin entry files
        run: |
          python - <<'PY'
          import glob, tarfile
          path, = glob.glob("dist/*.tar.gz")
          with tarfile.open(path, "r:gz") as archive:
              names = archive.getnames()
          required = ("plugin.yaml", "README.md", "LICENSE", "CHANGELOG.md",
                      "SECURITY.md", "nanlmind_hermes/__init__.py",
                      "scripts/demo_run.py", "scripts/live_smoke.py",
                      "docs/DEMO.md", "docs/DEMO_RESULTS.md", "docs/HERMES_DEMO.md",
                      "docs/LIVE_SMOKE.md", "docs/HERMES_CATALOG_ADMISSION.md")
          missing = [item for item in required if not any(name.endswith(item) for name in names)]
          if missing:
              raise SystemExit("source distribution missing: " + ", ".join(missing))
          PY
      - name: Install and import built wheel
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-install" dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/wheel-install" python -c "from nanlmind_hermes import register; assert callable(register)"
      - name: Install and import built source distribution
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/sdist-install" dist/*.tar.gz
          PYTHONPATH="$RUNNER_TEMP/sdist-install" python -c "from nanlmind_hermes import register; assert callable(register)"
      - name: Generate and verify distribution checksums
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: nanlmind-hermes-python-distributions
          path: dist/*
          if-no-files-found: error
