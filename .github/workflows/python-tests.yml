name: Hermes Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify base install remains dependency-free
        run: python -m pip install --no-deps -e .
      - name: Install optional auth test dependency
        run: python -m pip install cryptography
      - name: Run Hermes tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Run deterministic cross-resolution baselines
        run: |
          mkdir -p benchmark-results
          python -m benchmarks.cross_resolution_baseline > benchmark-results/cross_resolution_baseline.json
          cat benchmark-results/cross_resolution_baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: cross-resolution-baselines-py${{ matrix.python-version }}
          path: benchmark-results/cross_resolution_baseline.json
          if-no-files-found: error
