name: hermes-verified-graph-walk
on:
  pull_request:
    paths:
      - 'nanlmind_hermes/router_graph_walk.py'
      - 'nanlmind_hermes/router_graph_history.py'
      - 'nanlmind_hermes/router_graph_page.py'
      - 'tests/test_router_graph_walk.py'
      - 'tests/test_router_graph_history.py'
      - 'scripts/verify_real_router_graph_walk.py'
      - '.github/workflows/hermes-verified-graph-walk.yml'
  push:
    paths:
      - 'nanlmind_hermes/router_graph_walk.py'
      - 'nanlmind_hermes/router_graph_history.py'
      - 'nanlmind_hermes/router_graph_page.py'
      - 'tests/test_router_graph_walk.py'
      - 'tests/test_router_graph_history.py'
      - 'scripts/verify_real_router_graph_walk.py'
      - '.github/workflows/hermes-verified-graph-walk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-bounded-walk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify full revision replay
        run: python -m unittest discover -s tests -p 'test_router_graph_history.py' -v
      - name: Verify candidate graph walk and adversarial bounds
        run: python -m unittest discover -s tests -p 'test_router_graph_walk.py' -v
      - name: Check out real NaNROUTER graph provider
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNROUTER
          path: router
      - name: Verify signed live MC0DB graph and unchanged resident chart
        env:
          PYTHONPATH: .:router
        run: python scripts/verify_real_router_graph_walk.py
