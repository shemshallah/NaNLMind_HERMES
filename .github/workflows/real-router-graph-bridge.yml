name: real-router-graph-bridge
on:
  pull_request:
    paths:
      - 'nanlmind_hermes/router_graph_page.py'
      - 'nanlmind_hermes/router_graph_history.py'
      - 'nanlmind_hermes/router_graph_attestation.py'
      - 'nanlmind_hermes/__init__.py'
      - 'plugin.yaml'
      - 'tests/test_router_graph_page.py'
      - 'tests/test_router_graph_history.py'
      - 'tests/test_router_graph_sender.py'
      - 'tests/test_router_graph_tool_signed.py'
      - 'tests/test_router_graph_tool_schema.py'
      - 'scripts/verify_router_graph_bridge.py'
      - '.github/workflows/real-router-graph-bridge.yml'
  push:
    paths:
      - 'nanlmind_hermes/router_graph_page.py'
      - 'nanlmind_hermes/router_graph_history.py'
      - 'nanlmind_hermes/router_graph_attestation.py'
      - 'nanlmind_hermes/__init__.py'
      - 'plugin.yaml'
      - 'tests/test_router_graph_page.py'
      - 'tests/test_router_graph_history.py'
      - 'tests/test_router_graph_sender.py'
      - 'tests/test_router_graph_tool_signed.py'
      - 'tests/test_router_graph_tool_schema.py'
      - 'scripts/verify_router_graph_bridge.py'
      - '.github/workflows/real-router-graph-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  router-to-hermes-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Check out canonical router graph producer
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNROUTER
          path: router
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run real MC0DB graph to resident HERMES chart verifier
        env:
          PYTHONPATH: .:router
        run: |
          python -m unittest discover -s tests -p 'test_router_graph_page.py' -v
          python -m unittest discover -s tests -p 'test_router_graph_history.py' -v
          python -m unittest discover -s tests -p 'test_router_graph_sender.py' -v
          python -m unittest discover -s tests -p 'test_router_graph_tool_signed.py' -v
          python -m unittest discover -s tests -p 'test_router_graph_tool_schema.py' -v
          python scripts/verify_router_graph_bridge.py
