name: hermes-native-head-checkpoint-fence
on:
  push:
    paths:
      - 'nanlmind_hermes/native_head_fence.py'
      - 'nanlmind_hermes/native_chart_reconstruction.py'
      - 'nanlmind_hermes/native_head_checkpoint.py'
      - 'nanlmind_hermes/chart_storage.py'
      - 'tests/test_native_head_fence.py'
      - 'tests/test_native_head_reconstruction.py'
      - 'tests/test_native_head_checkpoint.py'
      - 'tests/test_local_runner_native_rebase.py'
      - '.github/workflows/native-head-fence.yml'
  pull_request:
    paths:
      - 'nanlmind_hermes/native_head_fence.py'
      - 'nanlmind_hermes/native_chart_reconstruction.py'
      - 'nanlmind_hermes/native_head_checkpoint.py'
      - 'nanlmind_hermes/chart_storage.py'
      - 'tests/test_native_head_fence.py'
      - 'tests/test_native_head_reconstruction.py'
      - 'tests/test_native_head_checkpoint.py'
      - 'tests/test_local_runner_native_rebase.py'
      - '.github/workflows/native-head-fence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint-root-and-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify read-only SHA/generation/root fence
        run: python -m unittest discover -s tests -p 'test_native_head_fence.py' -v
      - name: Refuse SHA-valid forged canonical chart reconstruction
        run: python -m unittest discover -s tests -p 'test_native_head_reconstruction.py' -v
      - name: Verify head journal to checkpoint full-page CAS and crash recovery
        run: python -m unittest discover -s tests -p 'test_native_head_checkpoint.py' -v
      - name: Verify single chart rebase of native learning with dirty rails
        run: python -m unittest discover -s tests -p 'test_local_runner_native_rebase.py' -v
      - name: Verify existing head transport and storage regressions
        run: python -m unittest discover -s tests -p 'test_head_bank_transport.py' -v
