name: hermes-graph-native-signed-receipt
on:
  pull_request:
    paths:
      - 'nanlmind_hermes/router_graph_native_receipt.py'
      - 'tests/test_router_graph_native_receipt.py'
      - '.github/workflows/hermes-graph-native-signed-receipt.yml'
      - 'docs/GRAPH_NATIVE_SIGNED_RECEIPT.md'
  push:
    branches: [main]
    paths:
      - 'nanlmind_hermes/router_graph_native_receipt.py'
      - 'tests/test_router_graph_native_receipt.py'
      - '.github/workflows/hermes-graph-native-signed-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-signed-native-receipt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify complete graph history and pinned sender regression
        run: python -m unittest discover -s tests -p 'test_router_graph_sender.py' -v
      - name: Verify all historical MathLeaf references
        run: python -m unittest discover -s tests -p 'test_router_graph_evidence.py' -v
      - name: Verify signed native result binding and forbidden claims
        run: python -m unittest discover -s tests -p 'test_router_graph_native_receipt.py' -v
