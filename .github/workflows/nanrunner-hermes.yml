name: nanrunner-hermes · isolated Ollama / Gemma plugin test

# Manual-only. No push, PR, cron, or repository_dispatch triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanrunner-hermes
  cancel-in-progress: false

jobs:
  nanrunner-hermes:
    name: nanrunner-hermes (temporary GitHub-hosted runner)
    if: github.repository == 'shemshallah/NaNLMind_HERMES' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: nanrunner-hermes
    timeout-minutes: 20
    steps:
      - name: Check out only HERMES plugin source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare temporary Python and install HERMES plugin
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HERMES plugin and run its standalone tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[auth]"
          python -m unittest discover -s tests -p 'test_nannet_device_client.py' -v

      - name: Install pinned Hermes Agent in this ephemeral job
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/v0.23.0/scripts/install.sh -o /tmp/nanrunner-hermes-install.sh
          bash /tmp/nanrunner-hermes-install.sh --commit 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19 --channel main --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate actual HERMES Agent plugin runtime
        shell: bash
        run: |
          set -euo pipefail
          hermes plugins validate . --install-deps
          hermes plugins doctor . --ci

      - name: One authenticated Gemma cloud inference; no secret output
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_CLOUD_SMOKE_OPT_IN: "yes"
        run: |
          set -euo pipefail
          set +x
          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "Missing environment secret OLLAMA_API_KEY on nanrunner-hermes; no API call made."
            exit 2
          fi
          python scripts/ollama_cloud_smoke.py

      - name: Summarize verified status without a credential
        if: success()
        shell: bash
        run: |
          echo "Native HERMES plugin admission and one bounded Ollama Gemma cloud response: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud request success does not prove the account's free-credit balance." >> "$GITHUB_STEP_SUMMARY"
