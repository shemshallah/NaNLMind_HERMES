[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanlmind-hermes"
version = "1.4.0"
description = "Hermes plugin for a local NaNLMind 256-head universe"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
# Keep conversational learning, SQLite memory and local native training
# installable on Android/Termux without a compiled crypto wheel.
auth = ["cryptography>=42,<47"]

[project.scripts]
nannet-authority = "nanlmind_hermes.authority_cli:main"

[tool.unittest]
start-directory = "tests"

[tool.setuptools.packages.find]
include = ["nanlmind_hermes*"]
exclude = ["experiments*", "tests*"]

[tool.setuptools.package-data]
nanlmind_hermes = ["nan/*.nan"]
